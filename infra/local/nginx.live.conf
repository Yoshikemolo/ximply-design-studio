# Local live preview only (scripts/live.py); never used by the packaged preview.
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 35m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  # The development server needs its reload channel, so the packaged policy is not applied here.
  # Agent requests wait for the model, which can take minutes for a picture.
  location /api/ai/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 240s;
    client_max_body_size 60m;
  }
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }
  # Keycloak of advanced mode, on the same origin so the page's policy stays 'self'. It is
  # resolved when asked for, so the preview still starts without the identity profile.
  location /auth/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $keycloak http://keycloak:8080;
    proxy_pass $keycloak;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    add_header X-Content-Type-Options nosniff always;
  }
  location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
  # Live preview: the page comes from the development server on the host, with its reload channel.
  location / {
    proxy_pass http://host.docker.internal:4390;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host localhost;
    proxy_read_timeout 1h;
  }
}
