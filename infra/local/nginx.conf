server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 35m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }
  location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
