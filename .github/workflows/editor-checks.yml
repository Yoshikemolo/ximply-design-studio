name: Editor build and tests
on:
  pull_request:
    branches: [dev, qa, demo, release, main]
  push:
    branches: ['feat/**', 'fix/**']
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: python3 scripts/check_styles.py
      - run: npm run test:coverage
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/api/requirements-dev.txt
      - name: Measure API coverage
        run: python -m pytest services/api/tests -q --cov=services/api/src --cov-branch --cov-report=term --cov-report=xml:reports/api/coverage.xml
      - name: Measure engineering coverage
        run: |
          python -m coverage run --branch --source=harness,scripts -m unittest discover -s tests -v
          python -m coverage xml -o reports/engineering/coverage.xml
      - name: Preserve coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            reports/typescript/
            reports/api/coverage.xml
            reports/engineering/coverage.xml
          if-no-files-found: error
      - name: Validate local Compose configuration
        env:
          XDS_API_TOKEN: ci-configuration-validation-only-not-a-deployed-secret
        run: docker compose -f compose.local.yaml config --quiet
      - name: Build and start disposable local preview
        env:
          XDS_API_TOKEN: ci-disposable-preview-token-not-for-other-environments
        run: docker compose -f compose.local.yaml up --build -d --wait
      - name: Smoke test local preview
        env:
          XDS_API_TOKEN: ci-disposable-preview-token-not-for-other-environments
        run: python scripts/smoke_local.py
      - name: Collect container diagnostics on failure
        if: failure()
        env:
          XDS_API_TOKEN: ci-disposable-preview-token-not-for-other-environments
        run: docker compose -f compose.local.yaml logs --no-color --tail 100
      - name: Stop disposable preview
        if: always()
        env:
          XDS_API_TOKEN: ci-disposable-preview-token-not-for-other-environments
        run: docker compose -f compose.local.yaml down --volumes --rmi local
