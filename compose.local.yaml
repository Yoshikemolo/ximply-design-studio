name: ximply-design-studio-preview
services:
  api:
    build:
      context: .
      dockerfile: infra/local/api.Dockerfile
    environment:
      XDS_API_TOKEN: ${XDS_API_TOKEN:?Run the local launcher first}
      XDS_DATA_DIR: /data
      # Advanced mode (FEAT-0032): empty unless the launcher starts with --identity.
      XDS_OIDC_ISSUER: ${XDS_OIDC_ISSUER:-}
      XDS_KEYCLOAK_INTERNAL_URL: ${XDS_KEYCLOAK_INTERNAL_URL:-}
      XDS_ADMIN_CLIENT_ID: xds-admin-service
      XDS_ADMIN_CLIENT_SECRET: ${XDS_ADMIN_CLIENT_SECRET:-}
      XDS_TOKEN_KEY: ${XDS_TOKEN_KEY:-}
    volumes:
      - projects:/data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [preview]
  web:
    build:
      context: .
      dockerfile: infra/local/web.Dockerfile
    ports:
      - "127.0.0.1:${XDS_PORT:-8090}:8080"
    depends_on:
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [preview]
  keycloak:
    # Local identity for advanced mode only; started by the launcher's --identity switch.
    profiles: [identity]
    image: quay.io/keycloak/keycloak:26.0.8
    command: [start-dev, --import-realm]
    environment:
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:${XDS_PORT:-8090}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: keycloak-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Start the launcher with --identity}
      XDS_STUDIO_ORIGIN: http://localhost:${XDS_PORT:-8090}
      XDS_ADMIN_CLIENT_SECRET: ${XDS_ADMIN_CLIENT_SECRET:?Start the launcher with --identity}
      XDS_FIRST_ADMIN_USERNAME: ${XDS_FIRST_ADMIN_USERNAME:-admin}
      XDS_FIRST_ADMIN_EMAIL: ${XDS_FIRST_ADMIN_EMAIL:-admin@localhost.test}
      XDS_FIRST_ADMIN_PASSWORD: ${XDS_FIRST_ADMIN_PASSWORD:?Start the launcher with --identity}
    volumes:
      - ./infra/keycloak/xds-realm.json:/opt/keycloak/data/import/xds-realm.json:ro
      - ./infra/keycloak/themes/xds:/opt/keycloak/themes/xds:ro
      - identity:/opt/keycloak/data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD-SHELL, "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks: [preview]
volumes:
  projects:
  identity:
networks:
  preview:
